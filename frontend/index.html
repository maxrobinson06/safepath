<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>SafePath Manchester</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    
    <!-- Mapbox GL JS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.js"></script>

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="map"></div>

    <div class="control-panel">
        <h2>SafePath</h2>
        <p class="subtitle">Click on map to choose Start & Destination</p>
        
        <div class="field">
            <span>Start:</span>
            <span id="start-coords" class="coord">Not selected</span>
        </div>
        <div class="field">
            <span>Destination:</span>
            <span id="end-coords" class="coord">Not selected</span>
        </div>

        <button id="route-btn" disabled>Calculate Safe Route</button>
        <button id="reset-btn" class="secondary-btn">Reset</button>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
